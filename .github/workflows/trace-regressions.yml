name: Trace regressions

on:
  pull_request:
    branches: [op]

permissions:
  contents: read

jobs:
  trace-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test inherited trace errors
        run: go test -count=1 -v ./tracer
